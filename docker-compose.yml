services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrcheck-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_USE_A_LONG_RANDOM_SECRET}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OCR_ENGINE=paddleocr
      - UPLOAD_DIR=/data/uploads
      - DATABASE_PATH=/data/metrc_check.db
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrcheck-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
